<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<title>For Aashi, from Vikram</title>
<style>
:root{--night:#0b1030;--night2:#141a47;--lav:#b9a7f5;--blush:#f6c1d3;--cream:#fbf1e1;--gold:#f2cf8a;--ink:#eee9ff;--dim:#b9b4d8;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Cormorant Garamond",Georgia,serif;--sans:ui-rounded,"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
--glass:linear-gradient(160deg,rgba(24,28,76,.74),rgba(11,14,44,.84));--line:rgba(255,255,255,.13)}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}html.large{font-size:20px}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:var(--sans);overflow:hidden;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid #ffe3a3;outline-offset:3px;border-radius:12px}
[tabindex="-1"]:focus{outline:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;background:radial-gradient(120% 90% at 50% 0%,#2a2566 0%,#161a50 45%,#0b1030 100%)}
body.no3d #stage{display:none}
body.no3d{background:radial-gradient(90% 60% at 70% 12%,rgba(246,193,211,.18),transparent 60%),radial-gradient(120% 90% at 30% 0%,#2f2a78 0%,#161a50 50%,#0b1030 100%)}
body.no3d::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 14%,#fff,transparent),radial-gradient(1px 1px at 46% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 66% 40%,#f2cf8a,transparent),radial-gradient(1px 1px at 28% 48%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 52%,#fff,transparent),radial-gradient(1px 1px at 8% 60%,#f6c1d3,transparent),radial-gradient(1px 1px at 55% 12%,#fff,transparent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* loader */
#loader{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(100% 80% at 50% 40%,#1d2160,#0b1030);transition:opacity 1.1s ease,visibility 1.1s}
#loader.out{opacity:0;visibility:hidden;pointer-events:none}
#loader .lstar{font-size:44px;color:var(--gold);text-shadow:0 0 24px rgba(242,207,138,.7);animation:glow 3.4s ease-in-out infinite}
#loader .lmsg{margin:0;font-family:var(--serif);font-style:italic;color:var(--dim)}
#loader .lbar{width:160px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#loader .lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lav),var(--gold));transition:width .6s ease}
@keyframes glow{50%{opacity:.55;transform:scale(.92)}}

/* top bar + nav */
#topbar{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;pointer-events:none}
#topbar>*{pointer-events:auto}
.brand{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--cream);padding:6px 12px;opacity:.9}
.brand span{color:var(--gold)}
.tools{display:flex;gap:8px}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(14,18,54,.6);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .3s,transform .2s,border-color .3s}
.icon-btn:hover:not(:disabled){background:rgba(60,56,130,.65);transform:translateY(-1px)}
.icon-btn.sm{width:44px;height:44px}
.icon-btn.primary{background:linear-gradient(135deg,#d8c9ff,#f6c1d3);color:#241d4d;border-color:transparent}
.icon-btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#e6dcff,#ffd3e0)}
.icon-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
#btn-sound .wave{display:none}#btn-sound.on .wave{display:inline}#btn-sound.on .slash{display:none}
#nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:10px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
.nav-label{min-height:46px;padding:0 20px;border-radius:30px;background:rgba(14,18,54,.6);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:.9rem;color:var(--cream);max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#progress{position:fixed;z-index:21;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lav),var(--blush),var(--gold));transition:width 1s ease}

/* panels */
#ui{position:fixed;z-index:10;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));top:calc(64px + env(safe-area-inset-top));pointer-events:none}
.panel{position:absolute;left:50%;bottom:0;width:min(640px,calc(100% - 28px));max-height:100%;overflow:auto;overscroll-behavior:contain;transform:translate(-50%,18px);opacity:0;visibility:hidden;transition:opacity .9s ease,transform .9s ease,visibility .9s;padding:22px 24px 26px;border-radius:26px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(3,4,20,.5);text-align:center}
.panel.active{opacity:1;visibility:visible;transform:translate(-50%,0);pointer-events:auto;transition-delay:.35s,.35s,0s}
.p-welcome,.p-closing{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;text-shadow:0 2px 24px rgba(5,6,30,.9)}
.p-letter{width:min(720px,calc(100% - 28px))}
h1,h2{font-family:var(--serif);font-weight:500;color:var(--cream);margin:0 0 .5rem;line-height:1.15;letter-spacing:.01em}
h1{font-size:clamp(2.1rem,8vw,3.6rem)}h2{font-size:clamp(1.5rem,5vw,2.1rem)}
h3{font-family:var(--serif);font-weight:500;font-size:1.25rem;color:var(--gold);margin:0 0 .35rem}
p{margin:.45rem 0}
.eyebrow{letter-spacing:.22em;text-transform:uppercase;font-size:.75rem;color:var(--lav)}
.lead,.body{font-size:1.05rem;color:var(--ink)}.body{color:var(--dim)}
.small{font-size:.85rem;color:var(--dim)}.dim{opacity:.75}
.big{font-family:var(--serif);font-size:clamp(1.2rem,4.2vw,1.55rem);line-height:1.4;color:var(--cream)}
.notice{color:var(--blush)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:14px}
.btn{min-height:46px;padding:0 22px;border-radius:30px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);transition:transform .2s,background .3s,box-shadow .3s}
.btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#cdbcff,#f6c1d3);color:#241d4d;border-color:transparent;font-weight:600;box-shadow:0 8px 28px rgba(185,167,245,.3)}
.btn.primary:hover{background:linear-gradient(135deg,#ddd0ff,#ffd3e0)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim);text-decoration:underline;text-underline-offset:4px}
.btn.small-btn{min-height:44px;padding:0 16px;font-size:.85rem}
.chip{min-height:44px;padding:0 16px;border-radius:24px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:.9rem}
.chip[aria-pressed="true"]{background:rgba(242,207,138,.18);border-color:var(--gold);color:var(--cream)}
.seg{gap:8px}
.note{min-height:3.4em;font-family:var(--serif);font-style:italic;font-size:1.2rem;color:var(--gold);margin:.8rem 0 .2rem}
.note.big{font-size:1.45rem;color:var(--cream);font-style:normal}
.note.dim{opacity:.55;color:var(--dim)}
.note.show{animation:rise 1.3s ease both}
.rv{opacity:0;animation:rise 1.5s var(--d,0s) ease forwards}
.intro-skip .rv{animation:none;opacity:1;transform:none}.intro-skip .skiprow{display:none}
.rv2{opacity:0}.panel.active .rv2{animation:rise 1.4s calc(var(--i)*.9s + .6s) ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lines{margin:.6rem 0 1rem}.lines .big{margin:.7rem 0}

/* breathing fallback orb */
.orb-fallback{display:none;height:150px;place-items:center;margin:.4rem 0}
body.no3d .orb-fallback{display:grid}
.orb-fallback i{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7e6,#f6c1d3 45%,#b9a7f5);box-shadow:0 0 50px rgba(246,193,211,.55);transform:scale(.7)}
.orb-fallback.run i{animation:breathe var(--cycle,10s) ease-in-out infinite}
@keyframes breathe{45%{transform:scale(1.6)}100%{transform:scale(.7)}}
.word{font-family:var(--serif);font-style:italic;font-size:1.4rem;color:var(--gold);min-height:2rem;margin:.2rem 0}

/* memories */
.memcard{margin:1rem auto .4rem;padding:18px 20px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:left}
.memcard.ph{border-style:dashed;border-color:rgba(242,207,138,.5)}
.memcard p{color:var(--ink)}
.memnav{gap:10px;display:flex;flex-wrap:nowrap;align-items:center;justify-content:center}.dots{display:flex;gap:4px;flex-wrap:nowrap}
.dot{width:44px;height:44px;border:0;background:none;position:relative}
.dot::after{content:"";position:absolute;inset:0;margin:auto;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.28);transition:.3s}
.dot[aria-current="true"]::after{background:var(--gold);box-shadow:0 0 12px var(--gold);transform:scale(1.35)}

/* needs */
.needs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.need{padding:14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.05);text-align:left;display:grid;gap:2px;min-height:76px;transition:.25s}
.need b{font-family:var(--serif);font-size:1.15rem;font-weight:500;color:var(--cream)}.need span{font-size:.82rem;color:var(--dim)}
.need:hover{background:rgba(255,255,255,.11);transform:translateY(-2px)}
.need[data-k=comfort]{border-left:3px solid var(--blush)}.need[data-k=distraction]{border-left:3px solid var(--lav)}.need[data-k=encouragement]{border-left:3px solid var(--gold)}.need[data-k=quiet]{border-left:3px solid #6f7bd6}.need[data-k=smile]{border-left:3px solid #ffd9a8}

/* letter */
.letter{margin:.8rem auto;padding:26px 28px;text-align:left;border-radius:6px 18px 6px 18px;background:linear-gradient(160deg,#fff8ea,#f6e9d3);color:#3a2f4d;font-family:var(--serif);font-size:1.12rem;line-height:1.7;max-height:min(46dvh,420px);overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 60px rgba(242,207,138,.18);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .4s ease}
.letter .greet{font-size:1.35rem;color:#5b3f7a}.letter .sig{font-style:italic;font-size:1.3rem;color:#5b3f7a}.letter .sign{margin-top:1.2rem}
.letter:focus-visible{outline-color:#8a5fd0}

/* closing */
.name{font-size:clamp(2.6rem,11vw,4.6rem);letter-spacing:.08em;color:var(--cream);text-shadow:0 0 30px rgba(246,193,211,.55)}
.sig{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--gold)}

@media (max-width:600px){.p-closing{padding-bottom:84px}.p-closing .name{font-size:2.3rem}.p-closing p{font-size:.95rem;margin:.4em 0}.p-closing{max-height:56dvh}}
/* tooltip, sheets, switches */
#tip{position:fixed;z-index:60;left:0;top:0;pointer-events:none;padding:6px 12px;border-radius:14px;background:rgba(10,12,40,.9);border:1px solid var(--line);font-size:.82rem;color:var(--cream)}
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(5,7,26,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet-card{width:min(460px,100%);max-height:90dvh;overflow:auto;padding:22px;border-radius:24px;background:linear-gradient(160deg,#1a1f56,#0e1240);border:1px solid var(--line);animation:rise .5s ease both}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.maplist{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.mapitem{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:16px;border:1px solid transparent;background:rgba(255,255,255,.04);text-align:left}
.mapitem:hover{background:rgba(255,255,255,.1)}
.mapitem .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;border:1px solid var(--line)}
.mapitem .nm{flex:1;font-family:var(--serif);font-size:1.1rem}
.mapitem .tick{width:8px;height:8px;border-radius:50%;background:transparent}
.mapitem.seen .tick{background:var(--lav)}
.mapitem.cur{border-color:var(--gold);background:rgba(242,207,138,.1)}.mapitem.cur .num{background:var(--gold);color:#241d4d;border-color:var(--gold)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.setrow b{display:block;font-weight:600}.setrow span{font-size:.82rem;color:var(--dim)}
.switch{flex:none;width:54px;height:32px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.1);position:relative;padding:0;transition:.3s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--cream);transition:.3s}
.switch[aria-checked="true"]{background:rgba(242,207,138,.55);border-color:var(--gold)}.switch[aria-checked="true"] i{transform:translateX(22px)}
#edit-bar{position:fixed;z-index:30;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;padding:8px 14px;border-radius:20px;background:rgba(40,30,10,.88);border:1px solid var(--gold);font-size:.85rem;width:max-content;max-width:calc(100% - 20px)}
body.edit [contenteditable]{outline:1px dashed rgba(242,207,138,.6);outline-offset:3px;border-radius:4px}
.edit-hint{color:var(--gold)}

@media (min-width:900px){.panel{padding:28px 34px 32px}}
@media (max-height:640px){.panel{padding:16px 18px}h1{font-size:2rem}}
body.reduce *,body.reduce *::before{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
body.reduce .orb-fallback.run i{animation:none;transform:scale(1.1)}
@media (prefers-reduced-motion:reduce){.rv,.rv2{animation:none!important;opacity:1}}
</style>
</head>
<body>
<div id="loader" role="status"><div class="lstar" aria-hidden="true">✦</div><p class="lmsg">Lighting the sky…</p><div class="lbar"><i></i></div></div>
<canvas id="stage" aria-hidden="true"></canvas>
<header id="topbar"></header>
<div id="edit-bar" hidden></div>
<main id="ui"></main>
<nav id="nav" aria-label="Journey"></nav>
<div id="progress" aria-hidden="true"><i></i></div>
<div id="map" class="sheet" role="dialog" aria-modal="true" aria-labelledby="map-t" hidden></div>
<div id="settings" class="sheet" role="dialog" aria-modal="true" aria-labelledby="set-t" hidden></div>
<div id="tip" role="tooltip" hidden></div>
<script id="aashi-content" type="application/json">{
  "_help": "EDIT ME. Every word Aashi reads lives in this file. After editing, run `node build.mjs` (or paste this JSON into the \u003cscript id=\"aashi-content\"> block of dist/index.html). Open the site with ?edit at the end of the address to type directly on the page and copy your edits back out.",
  "to": "Aashi",
  "from": "Vikram",
  "welcome": {
    "eyebrow": "A small, quiet place",
    "title": "For Aashi, from Vikram",
    "lead": "This isn't here to fix anything, or to make today better on a schedule. It's just a soft place to stop for a while. Nothing in here asks anything of you.",
    "soundHint": "Sound is off. You can switch it on, or keep everything quiet.",
    "enter": "Enter the dream world",
    "skip": "Skip the intro",
    "continue": "Pick up where I left off"
  },
  "stars": {
    "title": "A sky of small notes",
    "body": "Tap a star to open it. There are no wrong ones.",
    "button": "Open a star for me",
    "empty": "Take your time. The stars aren't going anywhere.",
    "notes": [
      "You don't have to be okay for this moment to count.",
      "Whatever you're carrying, you can set it down here for a minute.",
      "It's alright if you don't know what you need yet.",
      "You are allowed to be tired.",
      "Nothing has to be figured out tonight.",
      "Your feelings make sense, even the ones you can't explain.",
      "Be as gentle with yourself as you would be with someone you love.",
      "You don't owe anyone cheerful.",
      "Rest is not giving up.",
      "Someone is thinking of you kindly right now. That someone is Vikram.",
      "Hard days are heavy. You don't have to carry the whole thing at once.",
      "You can come back to this sky any time, or never. Both are fine."
    ]
  },
  "garden": {
    "title": "A garden that grows at your pace",
    "body": "Tap the ground to plant a glowing flower. Tap a flower again to read it again.",
    "button": "Plant a flower",
    "messages": [
      "Take all the time you need.",
      "You are not too much.",
      "Being sad doesn't make you a burden.",
      "A hard day is not a failed day.",
      "You can be a work in progress and still deserve gentleness.",
      "Breathe when you remember to. That's enough.",
      "Soft is allowed.",
      "You don't have to earn rest.",
      "It's okay to say \"not today.\"",
      "There is room for all of your feelings here.",
      "You are cared about, exactly as you are today.",
      "Small things count: water, a blanket, a quiet minute.",
      "Nothing about this moment makes you less loved.",
      "Even slow growth is growth."
    ]
  },
  "sanctuary": {
    "title": "You don't have to be okay right now",
    "lines": [
      "You don't have to pretend.",
      "You don't have to explain it.",
      "You don't have to solve anything tonight.",
      "You don't have to be cheerful for anyone."
    ],
    "promptsLabel": "If you'd like, and only if you'd like:",
    "prompts": [
      "Notice something soft nearby: a blanket, a sleeve, a pillow.",
      "Let your shoulders drop a little. Or don't.",
      "Take a sip of water if there's some close by.",
      "Look at something far away for a moment, then something near.",
      "Rest a hand on something warm, or on your own arm.",
      "Do absolutely nothing. That counts too."
    ],
    "footer": "None of these are tasks. You can scroll right past all of them."
  },
  "breathing": {
    "title": "A garden for breathing",
    "body": "Watch the light swell and soften. Breathe along if you like, or just watch. There is no right pace.",
    "guide": "Breathe with the light",
    "watch": "Just watch",
    "stop": "Stop",
    "paceLabel": "Pace",
    "paces": {
      "slow": "Slow",
      "slower": "Slower"
    },
    "inWord": "breathe in…",
    "outWord": "and let it go…",
    "stopped": "That's enough. Stay as long as you like.",
    "watching": "Just watching. No counting needed.",
    "note": "This is only a calm shape to look at. It isn't medical advice or treatment."
  },
  "memories": {
    "title": "A constellation, still being drawn",
    "body": "Each star holds a little card. Some are saving a spot for a memory that's still waiting to be written in.",
    "editHint": "Edit mode: click any card text to change it. Set placeholder to false in content.json once a card holds something real.",
    "cards": [
      {
        "placeholder": true,
        "title": "A memory, waiting",
        "text": "This star is saving a spot for a moment that belongs to the two of you."
      },
      {
        "placeholder": true,
        "title": "A place",
        "text": "Somewhere that felt a little like home. It'll be written in here."
      },
      {
        "placeholder": true,
        "title": "A laugh",
        "text": "A small, ordinary laugh is going to live on this star."
      },
      {
        "placeholder": true,
        "title": "A quiet moment",
        "text": "This one is waiting for a moment that needed no words."
      },
      {
        "placeholder": true,
        "title": "Something she said",
        "text": "A line worth keeping will be tucked in here."
      },
      {
        "placeholder": true,
        "title": "A star for later",
        "text": "Left blank on purpose, in case there's something new to add."
      }
    ]
  },
  "needs": {
    "title": "What do you need right now?",
    "body": "Pick whatever feels closest. You can change your mind as often as you like.",
    "another": "Another one",
    "back": "Back to the choices",
    "options": [
      {
        "key": "comfort",
        "label": "Comfort",
        "hint": "Something warm",
        "messages": [
          "You're allowed to rest here.",
          "If today was heavy, the heaviness can sit here for a bit.",
          "You don't have to hold it together in this room.",
          "Imagine a blanket that's exactly the right weight. It's yours.",
          "Whatever you feel is welcome here.",
          "You are not a problem to be solved."
        ]
      },
      {
        "key": "distraction",
        "label": "Distraction",
        "hint": "Something else to wonder about",
        "messages": [
          "Octopuses have three hearts. That's a lot of heart for one swim.",
          "Sea otters sometimes hold paws while they float, so they don't drift apart.",
          "A group of flamingos is called a flamboyance.",
          "Scientists have found that trees can swap nutrients through fungi in the soil. Quiet teamwork, underground.",
          "Clouds look weightless, yet a single fluffy one holds an astonishing amount of water.",
          "A very small quest: find three blue things near you. That's the whole quest.",
          "Honey has been found in ancient tombs and reported still edible. Sweet things can last."
        ]
      },
      {
        "key": "encouragement",
        "label": "Encouragement",
        "hint": "A gentle nudge",
